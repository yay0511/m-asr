[project]
name = "m-asr"
version = "0.1.0"
description = "Streaming multi-speaker ASR cascade with X-ASR and pyannote"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyannote-audio>=4.0.7",
    "pyyaml>=6.0.0",
    "silero-vad>=5.1",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
asr = [
    "sherpa-onnx>=1.13.2",
    "sherpa-onnx-core>=1.13.2",
]

[project.scripts]
m-asr = "m_asr.main:main"
m-asr-web = "m_asr.web_app:main"

[tool.uv]
package = true
