paths:
  x_asr_root: /root/shared-nvme/yuxinliu/X-ASR
  pyannote_audio_root: /root/shared-nvme/yuxinliu/pyannote-audio-4.0.7
  pyannote_model_dir: /root/shared-nvme/yuxinliu/pyannote-speaker-diarization-community-1
  x_asr_model_dir: /root/shared-nvme/yuxinliu/X-ASR/X-ASR-zh-en/deployment/models/chunk-960ms-model

runtime:
  sample_rate: 16000
  device: cuda
  asr_provider: auto
  max_workers: 2

chunker:
  vad_provider: silero
  frame_ms: 32
  silero_threshold: 0.35
  silero_min_silence_ms: 200
  silero_speech_pad_ms: 0
  silero_window_samples: 512
  speech_onset_threshold: 0.5
  speech_offset_threshold: 0.35
  energy_reference: 0.008
  end_silence_ms: 700
  min_chunk_duration: 0.35
  max_chunk_duration: 1.8
  left_padding_ms: 200
  right_padding_ms: 80

speaker:
  same_speaker_threshold: 0.68
  last_speaker_threshold: 0.56
  last_speaker_margin: 0.08
  new_speaker_initial_max_similarity: 0.07
  new_speaker_final_max_similarity: 0.12
  new_speaker_warmup_seconds: 12.0
  min_new_speaker_duration_initial: 2.0
  min_new_speaker_duration_final: 1.5
  min_centroid_update_similarity: 0.78
  centroid_update_alpha: 0.85
  min_embedding_duration: 0.7
  min_update_confidence: 0.6
  assign_uncertain_to_best: true
  mode: real

asr:
  mode: real
  text_format: none
  tail_padding_seconds: 1.0
